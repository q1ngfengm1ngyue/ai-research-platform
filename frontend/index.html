<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Research Assistant</title>
    <style>
      :root {
        color: #17202a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7f9;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        box-sizing: border-box;
        width: min(920px, calc(100% - 32px));
        margin: 40px auto;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #dce3e8;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgb(23 32 42 / 8%);
      }

      h1 {
        margin: 0 0 28px;
        font-size: 1.75rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input,
      select {
        box-sizing: border-box;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #aebbc4;
        border-radius: 6px;
        background: #ffffff;
        font: inherit;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 180px;
        gap: 16px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        padding: 11px 18px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: #1769aa;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      button.secondary {
        color: #1769aa;
        background: #e8f1f8;
      }

      #status {
        min-height: 24px;
        margin: 20px 0;
        padding: 12px;
        border-radius: 6px;
        background: #eef3f6;
      }

      #status.error {
        color: #842029;
        background: #f8d7da;
      }

      #status.success {
        color: #0f5132;
        background: #d1e7dd;
      }

      #results {
        display: grid;
        gap: 16px;
      }

      article {
        padding: 20px;
        border: 1px solid #dce3e8;
        border-radius: 8px;
      }

      article h2 {
        margin: 0 0 14px;
        font-size: 1.15rem;
        line-height: 1.4;
      }

      dl {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 7px 12px;
        margin: 0;
      }

      dt {
        font-weight: 600;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      details {
        margin-top: 16px;
      }

      details p {
        line-height: 1.6;
        white-space: pre-wrap;
      }

      @media (max-width: 640px) {
        main {
          margin: 16px auto;
          padding: 20px;
        }

        .controls,
        dl {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Research Assistant</h1>

      <form id="search-form">
        <div class="controls">
          <div>
            <label for="question">Research Question / Keywords</label>
            <input
              id="question"
              name="question"
              type="search"
              placeholder="e.g. CRISPR cancer therapy"
              required
            />
          </div>

          <div>
            <label for="source">Source</label>
            <select id="source" name="source">
              <option value="pubmed">PubMed</option>
              <option value="openalex">OpenAlex</option>
              <option value="all">All</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button id="search-button" type="submit">Search Literature</button>
          <button id="test-backend" class="secondary" type="button">Test Backend</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite">Ready to search.</p>
      <section id="results" aria-label="Literature results"></section>
    </main>

    <script>
      const API_BASE_URL = "http://127.0.0.1:8000";
      const form = document.querySelector("#search-form");
      const questionInput = document.querySelector("#question");
      const sourceSelect = document.querySelector("#source");
      const searchButton = document.querySelector("#search-button");
      const testButton = document.querySelector("#test-backend");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");

      function setStatus(message, kind = "") {
        status.textContent = message;
        status.className = kind;
      }

      function addMetadataRow(list, label, value) {
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        term.textContent = label;
        description.textContent = value || "Not available";
        list.append(term, description);
      }

      function renderLiterature(items) {
        results.replaceChildren();

        for (const item of items) {
          const article = document.createElement("article");
          const title = document.createElement("h2");
          const metadata = document.createElement("dl");

          title.textContent = item.title || "Untitled article";
          addMetadataRow(metadata, "Authors", item.authors.length ? item.authors.join(", ") : null);
          addMetadataRow(metadata, "Published", item.publication_date || item.year?.toString());
          addMetadataRow(metadata, "Journal", item.journal);
          addMetadataRow(metadata, "Database", item.source === "pubmed" ? "PubMed" : "OpenAlex");

          const doiTerm = document.createElement("dt");
          const doiDescription = document.createElement("dd");
          doiTerm.textContent = "DOI";
          if (item.doi) {
            const doiLink = document.createElement("a");
            doiLink.href = `https://doi.org/${item.doi}`;
            doiLink.target = "_blank";
            doiLink.rel = "noopener noreferrer";
            doiLink.textContent = item.doi;
            doiDescription.append(doiLink);
          } else {
            doiDescription.textContent = "Not available";
          }
          metadata.append(doiTerm, doiDescription);

          const abstractDetails = document.createElement("details");
          const abstractSummary = document.createElement("summary");
          const abstractText = document.createElement("p");
          abstractSummary.textContent = "Abstract";
          abstractText.textContent = item.abstract || "No abstract available.";
          abstractDetails.append(abstractSummary, abstractText);

          article.append(title, metadata, abstractDetails);
          results.append(article);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = questionInput.value.trim();
        if (!query) {
          setStatus("Please enter research keywords.", "error");
          return;
        }

        searchButton.disabled = true;
        results.replaceChildren();
        setStatus("Searching literature...");

        const params = new URLSearchParams({
          q: query,
          source: sourceSelect.value,
          limit: "10",
        });

        try {
          const response = await fetch(`${API_BASE_URL}/api/literature/search?${params}`);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          if (data.results.length === 0) {
            setStatus("No literature found. Try different keywords.");
            return;
          }

          renderLiterature(data.results);
          const warningText = data.warnings.length ? ` ${data.warnings.join(" ")}` : "";
          setStatus(`Found ${data.count} result(s).${warningText}`, "success");
        } catch (error) {
          console.error("Literature search failed", error);
          setStatus("Unable to retrieve literature. Please try again.", "error");
        } finally {
          searchButton.disabled = false;
        }
      });

      testButton.addEventListener("click", async () => {
        testButton.disabled = true;
        setStatus("Connecting to backend...");
        try {
          const response = await fetch(`${API_BASE_URL}/health`);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          setStatus(`Backend response: ${JSON.stringify(data)}`, "success");
        } catch (error) {
          setStatus("Unable to connect to backend.", "error");
        } finally {
          testButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
